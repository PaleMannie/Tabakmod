plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation 'curse.maven:spitting-image-1166208:9029576'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets {
    seedTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            gameDirectory = file('run-neoforge')
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

// Opt-in integration run; ordinary launches and the release JAR exclude test code.
if (providers.gradleProperty('seedTest').isPresent()) {
    neoForge.mods."${mod_id}".sourceSet sourceSets.seedTest
    neoForge.runs.server {
        gameDirectory = layout.buildDirectory.dir("seed-test-run-${minecraft_version}").get().asFile
        systemProperty 'tabakmod.testSeeds', 'true'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [minecraft_version_range: minecraft_version_range,
                      neo_version: neo_version, mod_id: mod_id, mod_name: mod_name,
                      mod_license: mod_license, mod_version: mod_version,
                      mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url = layout.projectDirectory.dir('mcmodsrepo') } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
idea.module { downloadJavadoc = downloadSources = true }
